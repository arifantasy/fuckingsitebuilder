<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 160" width="1000" height="160" role="img" aria-label="fuckingsitebuilder">
  <title>fuckingsitebuilder</title>

  <defs>
    <linearGradient id="bgMelt" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff00e6"/>
      <stop offset="0.2" stop-color="#00fff0"/>
      <stop offset="0.42" stop-color="#ffe600"/>
      <stop offset="0.66" stop-color="#ff6a00"/>
      <stop offset="1" stop-color="#7c00ff"/>
    </linearGradient>

    <linearGradient id="rainbowText" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#ff0080"/>
      <stop offset="0.25" stop-color="#ff8a00"/>
      <stop offset="0.5" stop-color="#f5ff00"/>
      <stop offset="0.75" stop-color="#00ff8a"/>
      <stop offset="1" stop-color="#00b3ff"/>
    </linearGradient>

    <radialGradient id="blobA" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#00e5ff"/>
      <stop offset="1" stop-color="#00e5ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="blobB" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#ff00b3"/>
      <stop offset="1" stop-color="#ff00b3" stop-opacity="0"/>
    </radialGradient>

    <filter id="melt" x="-8%" y="-30%" width="116%" height="160%">
      <feTurbulence type="fractalNoise" baseFrequency="0.012 0.09" numOctaves="2" seed="11" result="noise"/>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="22" xChannelSelector="R" yChannelSelector="G"/>
    </filter>

    <filter id="bevel" x="-20%" y="-40%" width="140%" height="180%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="2.5" result="blur"/>
      <feSpecularLighting in="blur" surfaceScale="7" specularConstant="1.2" specularExponent="22" lighting-color="#ffffff" result="spec">
        <fePointLight x="150" y="-30" z="160"/>
      </feSpecularLighting>
      <feComposite in="spec" in2="SourceAlpha" operator="in" result="specClip"/>
      <feComposite in="SourceGraphic" in2="specClip" operator="arithmetic" k1="0" k2="1" k3="1" k4="0"/>
    </filter>

    <filter id="soft"><feGaussianBlur stdDeviation="16"/></filter>
  </defs>

  <!-- melted rainbow slab -->
  <rect x="0" y="0" width="1000" height="160" fill="url(#bgMelt)" filter="url(#melt)"/>

  <!-- chaotic blobs -->
  <ellipse cx="210" cy="80" rx="220" ry="70" fill="url(#blobA)" filter="url(#soft)"/>
  <ellipse cx="800" cy="70" rx="200" ry="80" fill="url(#blobB)" filter="url(#soft)"/>

  <!-- clip-art sparkles -->
  <g fill="#ffffff" stroke="#ff00e6" stroke-width="2">
    <path transform="translate(150,34) scale(1.1)" d="M0,-16 L4,-4 L16,0 L4,4 L0,16 L-4,4 L-16,0 L-4,-4 Z"/>
    <path transform="translate(320,132) scale(0.8)" d="M0,-16 L4,-4 L16,0 L4,4 L0,16 L-4,4 L-16,0 L-4,-4 Z"/>
    <path transform="translate(700,30) scale(0.9)" d="M0,-16 L4,-4 L16,0 L4,4 L0,16 L-4,4 L-16,0 L-4,-4 Z"/>
  </g>

  <!-- ===== WORD ART ===== -->
  <g transform="rotate(-3 500 100) skewX(-6)"
     font-family="'Comic Sans MS','Comic Sans',Chalkboard,'Comic Neue',cursive"
     font-size="70" font-weight="900" text-anchor="middle" stroke-linejoin="round">
    <!-- clashing drop shadows -->
    <text x="507" y="126" fill="#00ff6a">fuckingsitebuilder</text>
    <text x="493" y="126" fill="#00e5ff">fuckingsitebuilder</text>
    <text x="500" y="131" fill="#ff0080">fuckingsitebuilder</text>
    <!-- white halo + black outline -->
    <text x="500" y="118" fill="none" stroke="#ffffff" stroke-width="17">fuckingsitebuilder</text>
    <text x="500" y="118" fill="none" stroke="#000000" stroke-width="9">fuckingsitebuilder</text>
    <!-- rainbow face with bevel -->
    <text x="500" y="118" fill="url(#rainbowText)" stroke="none" filter="url(#bevel)" font-style="italic">fuckingsitebuilder</text>
  </g>

  <!-- ===== rotating FREE starburst ===== -->
  <g transform="translate(892,64)">
    <g>
      <animateTransform attributeName="transform" type="scale"
        values="1 1; 1.18 1.18; 1 1" dur="1.3s" repeatCount="indefinite"/>
      <path fill="#ffe100" stroke="#ff0000" stroke-width="4" stroke-linejoin="round"
        d="M0,-58 L6.73,-25.11 L29,-50.23 L18.38,-18.38 L50.23,-29 L25.11,-6.73 L58,0
           L25.11,6.73 L50.23,29 L18.38,18.38 L29,50.23 L6.73,25.11 L0,58 L-6.73,25.11
           L-29,50.23 L-18.38,18.38 L-50.23,29 L-25.11,6.73 L-58,0 L-25.11,-6.73
           L-50.23,-29 L-18.38,-18.38 L-29,-50.23 L-6.73,-25.11 Z"/>
      <text x="0" y="-2" text-anchor="middle" font-family="Georgia,'Times New Roman',serif"
        font-size="22" font-weight="700" fill="#ff0000" stroke="#000000" stroke-width="1.5">100%</text>
      <text x="0" y="22" text-anchor="middle" font-family="Georgia,'Times New Roman',serif"
        font-size="17" font-weight="700" fill="#ff0000" stroke="#000000" stroke-width="1.5">FREE!!!</text>
    </g>
    <animateTransform attributeName="transform" type="rotate"
      values="-6 0 0; 6 0 0; -6 0 0" dur="2.7s" repeatCount="indefinite" additive="sum"/>
  </g>
</svg>
